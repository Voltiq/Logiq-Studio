[package]
name = "logiq-studio"
version = "1.8.0"
description = "Logiq Studio: an IDE for Java, Python, C, C++, Kotlin, PHP, SQL and the web with live UML class diagrams"
license = "MIT"
authors = ["Voltiq"]
edition = "2021"

[lib]
name = "logiq_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# A second start hands its folder to the window that is already open
tauri-plugin-single-instance = "2"
# Updates from GitHub Releases, signed
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deleting moves files to the Recycle Bin instead of erasing them
trash = "5"
# Watching the open folder so the explorer and editors follow outside changes
notify = "8"
# Find in files with regular expressions
regex = "1"
# Downloading the JUnit console launcher from Maven Central
ureq = "2"
# Unpacking the Java language server download
flate2 = "1"
tar = "0.4"
portable-pty = "0.9"
# SQL scripts run against SQLite, compiled in
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
