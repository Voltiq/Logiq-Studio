[package]
name = "logiq-studio"
version = "0.3.0"
description = "Logiq Studio: an IDE for Java, HTML, CSS and JavaScript with live UML class diagrams"
license = "MIT"
authors = ["Voltiq"]
edition = "2021"

[lib]
name = "logiq_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# A second start hands its folder to the window that is already open
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deleting moves files to the Recycle Bin instead of erasing them
trash = "5"
# Watching the open folder so the explorer and editors follow outside changes
notify = "8"
# Find in files with regular expressions
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
